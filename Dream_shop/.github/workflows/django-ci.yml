# Nom du workflow qui apparaît dans l'interface GitHub Actions
name: Django CI

# Définit quand ce workflow sera déclenché
on:
  push:
    # Se déclenche lorsque du code est poussé sur main ou master
    branches: [ main, master ]
  pull_request:
    # Se déclenche lors des pull requests vers main ou master
    branches: [ main, master ]

# Définit les tâches que ce workflow va exécuter
jobs:
  # Job principal pour exécuter les tests Django
  test:
    # Utilise une machine virtuelle Ubuntu récente
    runs-on: ubuntu-latest
    
    # Configuration de la stratégie d'exécution
    strategy:
      # Maximum 4 exécutions parallèles
      max-parallel: 4
      # Matrice de versions Python à tester (ici une seule)
      matrix:
        python-version: [3.9]

    # Étapes à exécuter dans ce job
    steps:
    # Récupère le code source du dépôt
    - uses: actions/checkout@v3
    
    # Configure l'environnement Python
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    # Installe les dépendances du projet
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # Exécute les tests Django
    - name: Run Tests
      # Configure les variables d'environnement nécessaires
      env:
        # Utilise le secret GitHub ou une valeur par défaut pour les tests
        SECRET_KEY: ${{ secrets.SECRET_KEY || 'django-insecure-key-for-testing' }}
        # Active le mode debug pour les tests
        DEBUG: 'True'
      # Commande pour lancer les tests
      run: |
        python manage.py test 